<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>🌤️ Weather App</h1>

        <p class="subtitle">
            Check live weather information for any city
        </p>

        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <!-- Error Message -->
        <p id="errorMessage"></p>

        <!-- Weather Card -->
        <div class="weather-card" id="weatherCard">

            <div class="location">
                <h2 id="cityName">City Name</h2>
                <p id="countryName">Country</p>
            </div>

            <div class="weather-main">

                <img
                    id="weatherIcon"
                    src=""
                    alt="Weather Icon"
                >

                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="description">Weather condition</p>
                </div>

            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- m/s</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
